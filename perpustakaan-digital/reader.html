<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1C1C1E">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>Baca Buku — Perpustakaan Digital</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="reader-body">

  <!-- Reader Header -->
  <header class="reader-header">
    <button class="back-btn" id="back-btn" aria-label="Kembali ke beranda">←</button>
    <h1 id="reader-title" class="reader-title">Memuat buku...</h1>
    <button class="bookmark-btn" id="bookmark-btn" aria-label="Tandai halaman ini">🔖</button>
  </header>

  <!-- PDF Canvas Area -->
  <div id="pdf-container" class="pdf-container">
    <canvas id="pdf-canvas" aria-label="Halaman buku"></canvas>

    <div id="pdf-loading" class="pdf-loading">
      <div class="pdf-spinner"></div>
      <p>Membuka buku...</p>
    </div>

    <div id="pdf-error" class="pdf-error hidden">
      <span>😕</span>
      <h3>Buku tidak bisa dibuka</h3>
      <p id="pdf-error-msg">Pastikan kamu sudah pernah membuka buku ini saat ada koneksi internet.</p>
      <button onclick="window.location.href='index.html'">← Kembali ke Beranda</button>
    </div>
  </div>

  <!-- Page Navigation -->
  <nav class="reader-nav" aria-label="Navigasi halaman">
    <button id="prev-btn" class="nav-btn" aria-label="Halaman sebelumnya" disabled>‹</button>
    <div class="page-info">
      <input id="page-input" class="page-input" type="number" min="1" value="1" aria-label="Nomor halaman">
      <span id="page-total" class="page-total">/ -</span>
    </div>
    <button id="next-btn" class="nav-btn" aria-label="Halaman berikutnya">›</button>
  </nav>

  <!-- Bookmarks Panel Overlay -->
  <div id="bookmarks-overlay" class="bookmarks-overlay hidden" id="bm-overlay"></div>

  <!-- Bookmarks Panel -->
  <div id="bookmarks-panel" class="bookmarks-panel hidden" role="dialog" aria-label="Penanda halaman">
    <div class="bookmarks-header">
      <h3>📑 Penanda Halaman</h3>
      <button id="close-bookmarks" aria-label="Tutup panel penanda">✕</button>
    </div>
    <div id="bookmarks-list" class="bookmarks-list">
      <p class="bookmarks-empty">Belum ada penanda.<br>Ketuk 🔖 untuk menandai halaman ini.</p>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <!-- PDF.js from CDN (cached by Service Worker) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="js/reader.js"></script>
</body>
</html>
